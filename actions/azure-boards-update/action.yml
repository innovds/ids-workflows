name: 'Azure Boards Update'
description: 'Parse AB#<id> from PR title/body and update work item state in Azure Boards'

inputs:
  event-action:
    description: 'GitHub event action (opened, ready_for_review, closed)'
    required: true
  pr-title:
    description: 'Pull request title'
    required: true
  pr-body:
    description: 'Pull request body'
    required: false
    default: ''
  pr-merged:
    description: 'Whether the PR was merged'
    required: false
    default: 'false'
  state-on-pr:
    description: 'Work item state when PR is opened'
    required: false
    default: 'In Review'
  state-on-merge:
    description: 'Work item state when PR is merged'
    required: false
    default: 'QA'
  azure-org:
    description: 'Azure DevOps organization'
    required: true
  azure-project:
    description: 'Azure DevOps project'
    required: true
  azure-pat:
    description: 'Azure DevOps PAT with Work Items R/W scope'
    required: true

outputs:
  work-item-ids:
    description: 'Comma-separated list of updated work item IDs'
    value: ${{ steps.update.outputs.ids }}
  state:
    description: 'The state that was applied'
    value: ${{ steps.update.outputs.state }}

runs:
  using: 'composite'
  steps:
    - name: Update work items
      id: update
      shell: bash
      run: |
        # Determine target state
        STATE=""
        if [[ "${{ inputs.event-action }}" == "closed" && "${{ inputs.pr-merged }}" == "true" ]]; then
          STATE="${{ inputs.state-on-merge }}"
        elif [[ "${{ inputs.event-action }}" == "opened" || "${{ inputs.event-action }}" == "ready_for_review" ]]; then
          STATE="${{ inputs.state-on-pr }}"
        fi

        if [ -z "$STATE" ]; then
          echo "No state change needed for action: ${{ inputs.event-action }}"
          echo "ids=" >> $GITHUB_OUTPUT
          echo "state=" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Parse AB#<id> from title and body
        IDS=$(printf '%s\n%s' "${{ inputs.pr-title }}" "${{ inputs.pr-body }}" | grep -oE 'AB#[0-9]+' | grep -oE '[0-9]+' | sort -u)

        if [ -z "$IDS" ]; then
          echo "No AB# references found in PR"
          echo "ids=" >> $GITHUB_OUTPUT
          echo "state=" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Found work items: $IDS"
        echo "Target state: $STATE"

        ORG="${{ inputs.azure-org }}"
        PROJECT="${{ inputs.azure-project }}"
        UPDATED=""

        for ID in $IDS; do
          HTTP_CODE=$(curl -s -o /tmp/ab_response.json -w "%{http_code}" \
            -u ":${{ inputs.azure-pat }}" \
            -X PATCH \
            -H "Content-Type: application/json-patch+json" \
            "https://dev.azure.com/$ORG/$PROJECT/_apis/wit/workitems/$ID?api-version=7.1" \
            -d "[{\"op\":\"replace\",\"path\":\"/fields/System.State\",\"value\":\"$STATE\"}]")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ AB#$ID → $STATE"
            [ -n "$UPDATED" ] && UPDATED="$UPDATED,$ID" || UPDATED="$ID"
          else
            echo "✗ AB#$ID failed ($HTTP_CODE)"
            cat /tmp/ab_response.json | head -3
          fi
        done

        echo "ids=$UPDATED" >> $GITHUB_OUTPUT
        echo "state=$STATE" >> $GITHUB_OUTPUT

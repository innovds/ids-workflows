name: 'Registry Login'
description: 'Login to container registry (ECR, DockerHub, GHCR, GitLab, Nexus, generic)'

inputs:
  type:
    description: 'Registry type: ecr | dockerhub | ghcr | gitlab | nexus | generic'
    required: true
  aws-role:
    description: 'AWS IAM Role ARN for OIDC (ECR only)'
    required: false
    default: ''
  aws-region:
    description: 'AWS Region (ECR only)'
    required: false
    default: '{{AWS_REGION}}'
  registry:
    description: 'Registry URL (required for nexus/generic, auto-derived for ecr/dockerhub/ghcr/gitlab)'
    required: false
    default: ''
  username:
    description: 'Registry username (non-ECR)'
    required: false
    default: ''
  password:
    description: 'Registry password/token (non-ECR)'
    required: false
    default: ''

outputs:
  registry:
    description: 'Resolved registry URL'
    value: ${{ steps.output.outputs.registry }}

runs:
  using: 'composite'
  steps:
    - name: Resolve registry URL
      id: resolve
      if: inputs.type != 'ecr'
      shell: bash
      run: |
        case "${{ inputs.type }}" in
          dockerhub) REGISTRY="docker.io" ;;
          ghcr)      REGISTRY="ghcr.io" ;;
          gitlab)
            REGISTRY="${{ inputs.registry }}"
            [ -z "$REGISTRY" ] && REGISTRY="registry.gitlab.com"
            ;;
          *)
            REGISTRY="${{ inputs.registry }}"
            if [ -z "$REGISTRY" ]; then
              echo "::error::registry input is required for type=${{ inputs.type }}"
              exit 1
            fi
            ;;
        esac
        echo "registry=$REGISTRY" >> $GITHUB_OUTPUT

    # ECR: OIDC + ECR login
    - uses: aws-actions/configure-aws-credentials@v4
      if: inputs.type == 'ecr'
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to ECR
      if: inputs.type == 'ecr'
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Non-ECR: docker/login-action
    - name: Login to registry
      if: inputs.type != 'ecr'
      uses: docker/login-action@v3
      with:
        registry: ${{ steps.resolve.outputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Set registry output
      id: output
      shell: bash
      run: |
        if [ "${{ inputs.type }}" = "ecr" ]; then
          echo "registry=${{ steps.ecr.outputs.registry }}" >> $GITHUB_OUTPUT
        else
          echo "registry=${{ steps.resolve.outputs.registry }}" >> $GITHUB_OUTPUT
        fi

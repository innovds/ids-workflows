name: 'Compose Deploy'
description: 'Deploy to VM via SSH and Docker Compose'

inputs:
  ssh-host:
    description: 'VM hostname or IP'
    required: true
  ssh-user:
    description: 'SSH user'
    required: false
    default: 'ec2-user'
  ssh-key:
    description: 'SSH private key content'
    required: true
  service-name:
    description: 'Service name (used for deploy directory)'
    required: true
  image-uri:
    description: 'Full image URI (registry/repo:tag)'
    required: true
  compose-file:
    description: 'Path to compose.yml in repo (leave empty to auto-generate standard template)'
    required: false
    default: ''
  deploy-path:
    description: 'Base deploy path on VM'
    required: false
    default: '/opt/ids/deploy'
  registry-type:
    description: 'Registry type: ecr | dockerhub | ghcr | gitlab | nexus | generic | none'
    required: false
    default: 'ecr'
  registry-username:
    description: 'Registry username (non-ECR)'
    required: false
    default: ''
  registry-password:
    description: 'Registry password/token (non-ECR)'
    required: false
    default: ''
  aws-region:
    description: 'AWS region for ECR login on VM'
    required: false
    default: '{{AWS_REGION}}'
  wait:
    description: 'Wait for service to become healthy'
    required: false
    default: 'true'
  timeout:
    description: 'Health check timeout in seconds'
    required: false
    default: '300'
  image-env-var:
    description: 'Environment variable name for image in .env'
    required: false
    default: 'DOCKER_IMAGE'

runs:
  using: 'composite'
  steps:
    - name: Prepare compose file
      id: compose
      shell: bash
      run: |
        if [ -n "${{ inputs.compose-file }}" ]; then
          if [ ! -f "${{ inputs.compose-file }}" ]; then
            echo "::error::Compose file not found: ${{ inputs.compose-file }}"
            exit 1
          fi
          echo "file=${{ inputs.compose-file }}" >> $GITHUB_OUTPUT
        else
          GENERATED="${{ runner.temp }}/compose.yml"
          cat > "$GENERATED" <<'COMPOSE'
        services:
          __SERVICE__:
            image: ${DOCKER_IMAGE}
            restart: unless-stopped
            env_file:
              - .env
              - path: .env.deploy
                required: false
            healthcheck:
              test: ["CMD", "curl", "-f", "http://localhost:${MS_PORT}${CONTEXT_PATH}/actuator/health"]
              interval: 30s
              timeout: 10s
              retries: 3
              start_period: 30s
            labels:
              - "traefik.enable=true"
              - "traefik.http.routers.__SERVICE__.rule=Host(`${DOMAIN}`) && PathPrefix(`${CONTEXT_PATH}`)"
              - "traefik.http.routers.__SERVICE__.entrypoints=websecure"
              - "traefik.http.routers.__SERVICE__.tls=true"
              - "traefik.http.services.__SERVICE__.loadbalancer.server.port=${MS_PORT}"
            networks:
              - local_network

        networks:
          local_network:
            external: true
        COMPOSE
          sed -i "s/__SERVICE__/${{ inputs.service-name }}/g" "$GENERATED"
          echo "file=$GENERATED" >> $GITHUB_OUTPUT
          echo "Generated compose.yml for service: ${{ inputs.service-name }}"
        fi

    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        cat >> ~/.ssh/config <<EOF
        Host ${{ inputs.ssh-host }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

    - name: Prepare remote directory
      shell: bash
      run: |
        SSH_CMD="ssh -i ~/.ssh/deploy_key ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}"
        DEPLOY_DIR="${{ inputs.deploy-path }}/${{ inputs.service-name }}"

        $SSH_CMD "mkdir -p $DEPLOY_DIR && \
          [ -f $DEPLOY_DIR/.env.deploy ] && cp $DEPLOY_DIR/.env.deploy $DEPLOY_DIR/.env.deploy.bak || true"

    - name: Transfer compose file
      shell: bash
      run: |
        scp -i ~/.ssh/deploy_key \
          ${{ steps.compose.outputs.file }} \
          ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}:${{ inputs.deploy-path }}/${{ inputs.service-name }}/compose.yml

    - name: Deploy
      shell: bash
      run: |
        SSH_CMD="ssh -i ~/.ssh/deploy_key ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}"
        DEPLOY_DIR="${{ inputs.deploy-path }}/${{ inputs.service-name }}"
        REGISTRY=$(echo "${{ inputs.image-uri }}" | cut -d'/' -f1)

        $SSH_CMD bash <<REMOTE_SCRIPT
          set -euo pipefail
          cd $DEPLOY_DIR

          # Registry login
          case "${{ inputs.registry-type }}" in
            ecr)
              aws ecr get-login-password --region ${{ inputs.aws-region }} | \
                docker login --username AWS --password-stdin $REGISTRY
              ;;
            none) ;;
            *)
              echo "${{ inputs.registry-password }}" | \
                docker login --username "${{ inputs.registry-username }}" --password-stdin $REGISTRY
              ;;
          esac

          # Update image in .env for compose.yml interpolation (persists across restarts)
          touch .env
          if grep -q "^${{ inputs.image-env-var }}=" .env; then
            sed -i "s|^${{ inputs.image-env-var }}=.*|${{ inputs.image-env-var }}=${{ inputs.image-uri }}|" .env
          else
            echo "${{ inputs.image-env-var }}=${{ inputs.image-uri }}" >> .env
          fi

          # Write deployment metadata
          cat > .env.deploy <<EOF
        DEPLOY_DATE=\$(date -Iseconds)
        DEPLOY_COMMIT=${{ github.sha }}
        EOF

          # Pull and deploy
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
        REMOTE_SCRIPT

    - name: Wait for health
      if: inputs.wait == 'true'
      shell: bash
      run: |
        SSH_CMD="ssh -i ~/.ssh/deploy_key ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}"
        DEPLOY_DIR="${{ inputs.deploy-path }}/${{ inputs.service-name }}"
        TIMEOUT=${{ inputs.timeout }}
        INTERVAL=10
        MAX_ATTEMPTS=$((TIMEOUT / INTERVAL))

        echo "Waiting for service health (timeout: ${TIMEOUT}s)..."
        for i in $(seq 1 $MAX_ATTEMPTS); do
          HEALTH=$($SSH_CMD "cd $DEPLOY_DIR && docker compose ps --format json" | \
            jq -sr 'if type == "array" then .[0] else . end | .Health // "starting"')

          if [ "$HEALTH" = "healthy" ]; then
            echo "Service healthy after $((i * INTERVAL))s"
            exit 0
          fi

          echo "Attempt $i/$MAX_ATTEMPTS: $HEALTH"
          sleep $INTERVAL
        done

        echo "::error::Service not healthy within ${TIMEOUT}s"
        $SSH_CMD "cd $DEPLOY_DIR && docker compose logs --tail=50"
        exit 1

    - name: Cleanup SSH
      if: always()
      shell: bash
      run: rm -f ~/.ssh/deploy_key

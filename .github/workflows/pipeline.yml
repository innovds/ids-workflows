name: Microservice Pipeline

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name (default: repo name)'
        required: false
        type: string
        default: ''
      registry-type:
        description: 'Registry type: ecr, dockerhub, ghcr, acr, nexus, generic'
        required: false
        type: string
        default: 'ecr'
      registry-url:
        description: 'Registry URL (required for acr/nexus/generic, auto-derived for ecr/dockerhub/ghcr)'
        required: false
        type: string
        default: ''
      repository:
        description: 'Image repository (default: app/{service-name} for ECR, {service-name} for others)'
        required: false
        type: string
        default: ''
      ecr-repository:
        description: '[Deprecated: use repository] ECR repository'
        required: false
        type: string
        default: ''
      aws-account-id:
        description: 'AWS Account ID for ECR'
        required: false
        type: string
        default: ''
      aws-region:
        description: 'AWS Region'
        required: false
        type: string
        default: ''
      run-tests:
        description: 'Run tests'
        required: false
        type: boolean
        default: false
      build-push:
        description: 'Build and push image'
        required: false
        type: boolean
        default: false
      deploy-env:
        description: 'Environment to deploy (int, stg, prod, or empty)'
        required: false
        type: string
        default: ''
      image-tag:
        description: 'Image tag for deployment (default: latest)'
        required: false
        type: string
        default: 'latest'
      cluster-prefix:
        description: 'ECS cluster prefix'
        required: false
        type: string
        default: 'app'
      cluster-name:
        description: 'Override ECS cluster name (default: {prefix}-{env}-cluster)'
        required: false
        type: string
        default: ''
      ecs-service-name:
        description: 'Override ECS service name (default: {service}-task-service)'
        required: false
        type: string
        default: ''
      task-family:
        description: 'Override task family (default: {service}-task)'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Docker build args (multiline KEY=VALUE)'
        required: false
        type: string
        default: ''
      image-tag-prefix:
        description: 'Prefix for image tags (e.g., env name: int, stg, prod)'
        required: false
        type: string
        default: ''
      deploy-type:
        description: 'Deployment type: ecs | compose'
        required: false
        type: string
        default: 'ecs'
      ssh-host:
        description: '[Compose] VM hostname or IP'
        required: false
        type: string
        default: ''
      ssh-user:
        description: '[Compose] SSH user'
        required: false
        type: string
        default: 'ec2-user'
      compose-file:
        description: '[Compose] Path to compose.yml in repo'
        required: false
        type: string
        default: 'compose.yml'
      deploy-path:
        description: '[Compose] Base deploy path on VM'
        required: false
        type: string
        default: '/opt/ids/deploy'
      image-env-var:
        description: '[Compose] Env var name for image in .env'
        required: false
        type: string
        default: 'DOCKER_IMAGE'

    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
      MAVEN_SETTINGS_XML:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      SSH_PRIVATE_KEY:
        required: false

    outputs:
      image-tag:
        description: 'Built image tag'
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    if: inputs.run-tests || inputs.build-push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
      service-name: ${{ steps.service.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve service name
        id: service
        run: |
          NAME="${{ inputs.service-name }}"
          [ -z "$NAME" ] && NAME="${{ github.event.repository.name }}"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Maven settings
        uses: innovds/ids-workflows/actions/maven-settings@main
        id: maven
        with:
          settings-base64: ${{ secrets.MAVEN_SETTINGS_XML }}

      - name: Run tests
        if: inputs.run-tests
        uses: innovds/ids-workflows/actions/docker-build@main
        with:
          target: test
          push: 'false'
          maven-settings-path: ${{ steps.maven.outputs.settings-path }}
          build-args: ${{ inputs.build-args }}

      - name: Generate tag
        if: inputs.build-push
        id: tag
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          PREFIX="${{ inputs.image-tag-prefix }}"
          if [ -n "$PREFIX" ]; then
            # With prefix: {prefix}-sha-xxx, latest, {prefix}
            echo "value=${PREFIX}-sha-$SHA" >> $GITHUB_OUTPUT
            {
              echo "extra<<EOF"
              echo "latest"
              echo "$PREFIX"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            # Without prefix: sha-xxx, latest
            echo "value=sha-$SHA" >> $GITHUB_OUTPUT
            echo "extra=latest" >> $GITHUB_OUTPUT
          fi

      - name: Resolve registry
        if: inputs.build-push
        id: registry
        run: |
          TYPE="${{ inputs.registry-type }}"

          # Resolve registry URL
          case "$TYPE" in
            ecr)
              REGISTRY="${{ inputs.registry-url }}"
              [ -z "$REGISTRY" ] && REGISTRY="${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
              ;;
            dockerhub)
              REGISTRY="docker.io"
              ;;
            ghcr)
              REGISTRY="ghcr.io"
              ;;
            *)
              REGISTRY="${{ inputs.registry-url }}"
              if [ -z "$REGISTRY" ]; then
                echo "::error::registry-url is required for registry-type=$TYPE"
                exit 1
              fi
              ;;
          esac

          # Resolve repository: repository > ecr-repository (compat) > default
          REPO="${{ inputs.repository }}"
          [ -z "$REPO" ] && REPO="${{ inputs.ecr-repository }}"
          if [ -z "$REPO" ]; then
            if [ "$TYPE" = "ecr" ]; then
              REPO="app/${{ steps.service.outputs.name }}"
            else
              REPO="${{ steps.service.outputs.name }}"
            fi
          fi

          echo "url=$REGISTRY" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: Login to ECR
        if: inputs.build-push && inputs.registry-type == 'ecr'
        uses: innovds/ids-workflows/actions/ecr-login@main
        with:
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to registry
        if: inputs.build-push && inputs.registry-type != 'ecr'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.url }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push
        if: inputs.build-push
        uses: innovds/ids-workflows/actions/docker-build@main
        with:
          target: final
          push: 'true'
          registry: ${{ steps.registry.outputs.url }}
          repository: ${{ steps.registry.outputs.repo }}
          image-tag: ${{ steps.tag.outputs.value }}
          extra-tags: ${{ steps.tag.outputs.extra }}
          maven-settings-path: ${{ steps.maven.outputs.settings-path }}
          build-args: ${{ inputs.build-args }}

  deploy:
    name: Deploy ${{ inputs.deploy-env }}
    needs: [build]
    if: always() && inputs.deploy-env != '' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env }}

    steps:
      - name: Resolve service name
        id: service
        run: |
          NAME="${{ needs.build.outputs.service-name }}"
          [ -z "$NAME" ] && NAME="${{ inputs.service-name }}"
          [ -z "$NAME" ] && NAME="${{ github.event.repository.name }}"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Resolve image
        id: image
        run: |
          TAG="${{ needs.build.outputs.image-tag }}"
          if [ -z "$TAG" ]; then
            # No build output, use input with optional prefix
            PREFIX="${{ inputs.image-tag-prefix }}"
            BASE_TAG="${{ inputs.image-tag }}"
            if [ -n "$PREFIX" ]; then
              # With prefix: "latest" -> just prefix, otherwise prefix-tag
              if [ "$BASE_TAG" = "latest" ]; then
                TAG="$PREFIX"
              else
                TAG="${PREFIX}-${BASE_TAG}"
              fi
            else
              TAG="$BASE_TAG"
            fi
          fi

          # Resolve registry URL
          TYPE="${{ inputs.registry-type }}"
          case "$TYPE" in
            ecr)
              REGISTRY="${{ inputs.registry-url }}"
              [ -z "$REGISTRY" ] && REGISTRY="${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
              ;;
            dockerhub) REGISTRY="docker.io" ;;
            ghcr) REGISTRY="ghcr.io" ;;
            *) REGISTRY="${{ inputs.registry-url }}" ;;
          esac

          # Resolve repository
          REPO="${{ inputs.repository }}"
          [ -z "$REPO" ] && REPO="${{ inputs.ecr-repository }}"
          if [ -z "$REPO" ]; then
            if [ "$TYPE" = "ecr" ]; then
              REPO="app/${{ steps.service.outputs.name }}"
            else
              REPO="${{ steps.service.outputs.name }}"
            fi
          fi

          echo "uri=$REGISTRY/$REPO:$TAG" >> $GITHUB_OUTPUT

      # --- ECS deployment ---
      - name: Resolve ECS names
        if: inputs.deploy-type == 'ecs'
        id: ecs
        run: |
          # Cluster: override or {prefix}-{env}-cluster
          CLUSTER="${{ inputs.cluster-name }}"
          [ -z "$CLUSTER" ] && CLUSTER="${{ inputs.cluster-prefix }}-${{ inputs.deploy-env }}-cluster"
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT

          # Service: override or {service}-task-service
          SERVICE="${{ inputs.ecs-service-name }}"
          [ -z "$SERVICE" ] && SERVICE="${{ steps.service.outputs.name }}-task-service"
          echo "service=$SERVICE" >> $GITHUB_OUTPUT

          # Task: override or {service}-task
          TASK="${{ inputs.task-family }}"
          [ -z "$TASK" ] && TASK="${{ steps.service.outputs.name }}-task"
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        if: inputs.deploy-type == 'ecs'
        uses: innovds/ids-workflows/actions/ecs-deploy@main
        with:
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}
          cluster-name: ${{ steps.ecs.outputs.cluster }}
          service-name: ${{ steps.ecs.outputs.service }}
          task-family: ${{ steps.ecs.outputs.task }}
          container-name: ${{ steps.service.outputs.name }}
          image-uri: ${{ steps.image.outputs.uri }}

      # --- Compose deployment ---
      - uses: actions/checkout@v4
        if: inputs.deploy-type == 'compose'

      - name: Deploy via Compose
        if: inputs.deploy-type == 'compose'
        uses: innovds/ids-workflows/actions/compose-deploy@main
        with:
          ssh-host: ${{ inputs.ssh-host }}
          ssh-user: ${{ inputs.ssh-user }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          service-name: ${{ steps.service.outputs.name }}
          image-uri: ${{ steps.image.outputs.uri }}
          compose-file: ${{ inputs.compose-file }}
          deploy-path: ${{ inputs.deploy-path }}
          registry-type: ${{ inputs.registry-type }}
          aws-region: ${{ inputs.aws-region }}
          image-env-var: ${{ inputs.image-env-var }}

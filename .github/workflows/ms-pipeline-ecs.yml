name: Pipeline (ECS Fargate)

on:
  workflow_call:
    inputs:
      run-tests:
        description: 'Run tests before build'
        type: boolean
        default: false
      build-image:
        description: 'Build and push image'
        type: boolean
        default: true
      image-tag:
        description: 'Deploy specific tag (overrides auto-generated sha)'
        type: string
        default: ''
      image-tag-prefix:
        description: 'Tag prefix (e.g., spring4)'
        type: string
        default: ''
      deploy-env:
        description: 'Target environment (int, stg, prod)'
        type: string
        default: 'int'
      registry-type:
        description: 'Registry type: ecr | dockerhub | ghcr | gitlab | nexus | generic'
        type: string
        default: 'ecr'
      registry-url:
        description: 'Registry URL (auto-derived for ecr/dockerhub/ghcr/gitlab)'
        type: string
        default: ''
      repository:
        description: 'Image repository (default: app/{repo-name} for ECR, {repo-name} for others)'
        type: string
        default: ''
      build-args:
        description: 'Docker build args (multiline KEY=VALUE)'
        type: string
        default: ''
      aws-region:
        description: 'AWS Region'
        type: string
        default: ''
      cluster-name:
        description: 'ECS cluster name (default: app-{env})'
        type: string
        default: ''
      service-name:
        description: 'ECS service name (default: {repo-name}-{env})'
        type: string
        default: ''
      task-family:
        description: 'ECS task family (default: {repo-name}-{env})'
        type: string
        default: ''
      container-name:
        description: 'Container name in task def (default: {repo-name})'
        type: string
        default: ''

    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
      MAVEN_SETTINGS_XML:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env }}

    steps:
      - uses: actions/checkout@v4

      - name: Maven settings
        id: maven
        uses: innovds/ids-workflows/actions/maven-settings@main
        with:
          settings-base64: ${{ secrets.MAVEN_SETTINGS_XML }}

      - name: Run tests
        if: inputs.run-tests
        uses: innovds/ids-workflows/actions/docker-build@main
        with:
          target: test
          maven-settings-path: ${{ steps.maven.outputs.settings-path }}
          build-args: ${{ inputs.build-args }}

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          PREFIX="${{ inputs.image-tag-prefix }}"
          if [ -n "${{ inputs.image-tag }}" ]; then
            echo "value=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
            echo "extra=" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.build-image }}" = "true" ]; then
            SHA="sha-${GITHUB_SHA::7}"
            if [ -n "$PREFIX" ]; then
              echo "value=${PREFIX}-${SHA}" >> $GITHUB_OUTPUT
              {
                echo "extra<<EOF"
                echo "latest"
                echo "$PREFIX"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            else
              echo "value=${SHA}" >> $GITHUB_OUTPUT
              echo "extra=latest" >> $GITHUB_OUTPUT
            fi
          else
            if [ -n "$PREFIX" ]; then
              echo "value=${PREFIX}" >> $GITHUB_OUTPUT
            else
              echo "value=latest" >> $GITHUB_OUTPUT
            fi
            echo "extra=" >> $GITHUB_OUTPUT
          fi

      - name: Registry login
        id: registry
        uses: innovds/ids-workflows/actions/registry-login@main
        with:
          type: ${{ inputs.registry-type }}
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}
          registry: ${{ inputs.registry-url }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve repository
        id: repo
        shell: bash
        run: |
          REPO="${{ inputs.repository }}"
          if [ -z "$REPO" ]; then
            if [ "${{ inputs.registry-type }}" = "ecr" ]; then
              REPO="app/${{ github.event.repository.name }}"
            else
              REPO="${{ github.event.repository.name }}"
            fi
          fi
          echo "name=$REPO" >> $GITHUB_OUTPUT

      - name: Build & Push
        if: inputs.build-image
        uses: innovds/ids-workflows/actions/docker-build@main
        with:
          push: 'true'
          registry: ${{ steps.registry.outputs.registry }}
          repository: ${{ steps.repo.outputs.name }}
          image-tag: ${{ steps.tag.outputs.value }}
          extra-tags: ${{ steps.tag.outputs.extra }}
          maven-settings-path: ${{ steps.maven.outputs.settings-path }}
          build-args: ${{ inputs.build-args }}

      - name: Resolve ECS names
        id: ecs
        shell: bash
        run: |
          ENV="${{ inputs.deploy-env }}"
          REPO="${{ github.event.repository.name }}"
          CLUSTER="${{ inputs.cluster-name }}"; [ -z "$CLUSTER" ] && CLUSTER="app-${ENV}"
          SERVICE="${{ inputs.service-name }}"; [ -z "$SERVICE" ] && SERVICE="${REPO}-${ENV}"
          TASK="${{ inputs.task-family }}"; [ -z "$TASK" ] && TASK="${REPO}-${ENV}"
          CONTAINER="${{ inputs.container-name }}"; [ -z "$CONTAINER" ] && CONTAINER="$REPO"
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "container=$CONTAINER" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        uses: innovds/ids-workflows/actions/ecs-deploy@main
        with:
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}
          cluster-name: ${{ steps.ecs.outputs.cluster }}
          service-name: ${{ steps.ecs.outputs.service }}
          task-family: ${{ steps.ecs.outputs.task }}
          container-name: ${{ steps.ecs.outputs.container }}
          image-uri: ${{ steps.registry.outputs.registry }}/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.value }}
